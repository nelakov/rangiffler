server:
  port: 9020
  error:
    include:
      message: true
spring:
  grpc:
    server:
      port: 9021
      max-inbound-message-size: 50000000
  application:
    name: rangiffler-photo
  datasource:
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
    username: root
    password: secret
  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    generate-ddl: true
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

---
spring:
  config:
    activate:
      on-profile: 'local'
  datasource:
    url: jdbc:mysql://localhost:3306/rangiffler-photo?serverTimezone=UTC&createDatabaseIfNotExist=true
  jpa:
    hibernate:
      ddl-auto: validate
  grpc:
    client:
      channels:
        grpcCountryClient:
          address: 'static://127.0.0.1:9011'
          negotiation-type: plaintext
        grpcUserdataClient:
          address: 'static://127.0.0.1:9031'
          negotiation-type: plaintext

---
spring:
  config:
    activate:
      on-profile: 'docker'
  datasource:
    url: jdbc:mysql://rangiffler-all-db:3306/rangiffler-photo?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true
  jpa:
    hibernate:
      ddl-auto: validate
  grpc:
    client:
      channels:
        grpcCountryClient:
          address: 'static://country.rangiffler.dc:9011'
          negotiation-type: plaintext
        grpcUserdataClient:
          address: 'static://userdata.rangiffler.dc:9031'
          negotiation-type: plaintext
---